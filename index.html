<html dir="ltr" lang="eng">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>mini shop</title>
        <link rel="stylesheet" href="style.css">
        <script src="./app.js" defer></script>
    </head>
    <body>
        <header>
            <h1>mini<span>shop</span></h1>
            <div id="cart">
                <img src="" alt="">
                <p class="m-8">my cart</p>
                <div id="wishlist-count" class="m-8 p-4">0</div>
            </div>
        </header>
        <main>
            <!-- product section genrated in app.js -->
            <section id="products">
                <h2 class="m-8">curated for you<span>shop the colloction</span></h2>
                <div class="countainer" id="product-countainer">
                    
                </div>
            </section>
            <!-- shopping cart section -->
            <section id="shopping-cart" class="m-16">
                <div id="title">
                    <p class="m-8">your pick's</p>
                    <div id="title-countainer">
                        <p class="m-8">Shopping Cart<span id="shopping-cart-count"></span></p>
                        <div id="total-countainer">
                            <p id="total-price" class="m-8"></p>
                            <button id="clear-btn" class="m-8">clear all</button>
                        </div>
                    </div>
                </div>
                <!-- shopping cart empty state -->
                <div id="empty-state">
                    <img src="" alt="">
                    <p>empty shopping cart</p>
                </div>
                <div id="product-in-cart"></div>
            </section>
        </main>
        <footer></footer>
    </body>
</html>
